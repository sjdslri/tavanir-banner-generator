<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; overflow: hidden; }
    .poster { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
    .bg { position: absolute; top: 0; left: 0; width: 1080px; height: 1080px; object-fit: cover; z-index: 1; }
    .content { position: absolute; top: 0; left: 0; width: 1080px; height: 1080px; z-index: 2; }

    /* لوگو - دایره‌ای */
    .logo {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* تیتر */
    .title {
      position: absolute;
      top: 420px;
      right: 120px;
      width: 600px;
      font-size: 40px;
      font-weight: 900;
      color: #8B6508;
      text-align: center;
    }

    /* لیست اخبار */
    .news-list {
      position: absolute;
      top: 520px;
      right: 120px;
      width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .news-item {
      font-size: 24px;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .news-meta {
      font-size: 16px;
      color: #8B6508;
      font-weight: bold;
    }

    /* پاورقی */
    .footer {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      text-align: center;
      font-size: 20px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="poster">
    <img src="{{{__background}}}" class="bg" alt="">
    <div class="content">
      <div class="logo" data-drag-id="logo"><img src="{{{logo}}}" alt=""></div>
      <h1 class="title" data-drag-id="title">{{title}}</h1>
      <div class="news-list">
        <!--LOOP:newsItems-->
        <div class="news-item" data-drag-id="news-{{date}}-{{time}}">
          <div class="news-meta">{{date}} - ساعت {{time}}</div>
          <div>{{text}}</div>
        </div>
        <!--ENDLOOP:newsItems-->
      </div>
      <div class="footer" data-drag-id="footer">{{footerText}}</div>
    </div>
  </div>
</body>
</html>
